<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Domain Extractor — Premium Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
        --gold: #d4af37;
        --gold-light: #f5e6a8;
        --gold-dark: #a8842c;
        --bg-dark: #0a0a0f;
        --bg-card: #12121a;
        --bg-elevated: #1a1a26;
        --border: #2a2a3a;
        --text-primary: #f0f0f5;
        --text-muted: #8a8a9a;
        --success: #2ecc71;
    }

    body {
        font-family: 'Inter', sans-serif;
        background: var(--bg-dark);
        background-image:
            radial-gradient(ellipse at top left, rgba(212, 175, 55, 0.08) 0%, transparent 50%),
            radial-gradient(ellipse at bottom right, rgba(212, 175, 55, 0.05) 0%, transparent 50%);
        min-height: 100vh;
        padding: 40px 20px;
        color: var(--text-primary);
        display: flex;
        justify-content: center;
        align-items: flex-start;
    }

    .container {
        width: 100%;
        max-width: 900px;
        background: linear-gradient(145deg, var(--bg-card), var(--bg-elevated));
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 40px;
        box-shadow:
            0 20px 60px rgba(0, 0, 0, 0.6),
            0 0 0 1px rgba(212, 175, 55, 0.1) inset;
        position: relative;
        overflow: hidden;
    }

    .container::before {
        content: '';
        position: absolute;
        top: 0; left: 0; right: 0;
        height: 3px;
        background: linear-gradient(90deg, transparent, var(--gold), transparent);
    }

    /* === HEADER === */
    .header {
        text-align: center;
        margin-bottom: 32px;
        padding-bottom: 24px;
        border-bottom: 1px solid var(--border);
    }

    .badge {
        display: inline-block;
        font-size: 11px;
        letter-spacing: 3px;
        text-transform: uppercase;
        color: var(--gold);
        padding: 6px 16px;
        border: 1px solid var(--gold-dark);
        border-radius: 100px;
        margin-bottom: 16px;
        background: rgba(212, 175, 55, 0.05);
    }

    h1 {
        font-family: 'Playfair Display', serif;
        font-size: 34px;
        font-weight: 700;
        background: linear-gradient(135deg, var(--gold-light), var(--gold), var(--gold-dark));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        margin-bottom: 8px;
    }

    .subtitle {
        color: var(--text-muted);
        font-size: 14px;
        font-weight: 300;
    }

    /* === INPUT AREA === */
    .input-group { margin-bottom: 20px; }

    label {
        display: block;
        font-size: 12px;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        color: var(--gold);
        margin-bottom: 10px;
        font-weight: 500;
    }

    textarea {
        width: 100%;
        height: 180px;
        padding: 16px 18px;
        background: #0d0d14;
        border: 1px solid var(--border);
        border-radius: 12px;
        color: var(--text-primary);
        font-family: 'Courier New', monospace;
        font-size: 13px;
        line-height: 1.7;
        resize: vertical;
        transition: all 0.3s ease;
        outline: none;
    }

    textarea:focus {
        border-color: var(--gold-dark);
        box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.1);
    }

    textarea::placeholder { color: #55556a; }

    /* === BUTTONS === */
    .btn-row {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        margin-bottom: 28px;
    }

    button {
        font-family: 'Inter', sans-serif;
        font-size: 14px;
        font-weight: 500;
        letter-spacing: 0.5px;
        padding: 13px 24px;
        border-radius: 10px;
        border: none;
        cursor: pointer;
        transition: all 0.25s ease;
        display: inline-flex;
        align-items: center;
        gap: 8px;
    }

    .btn-primary {
        background: linear-gradient(135deg, var(--gold), var(--gold-dark));
        color: #0a0a0f;
        flex: 1;
        justify-content: center;
        font-weight: 600;
        box-shadow: 0 4px 20px rgba(212, 175, 55, 0.25);
    }

    .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 30px rgba(212, 175, 55, 0.4);
    }

    .btn-primary:active { transform: translateY(0); }

    .btn-secondary {
        background: var(--bg-elevated);
        color: var(--text-primary);
        border: 1px solid var(--border);
    }

    .btn-secondary:hover {
        border-color: var(--gold-dark);
        color: var(--gold);
    }

    .btn-secondary.copied {
        background: rgba(46, 204, 113, 0.15);
        border-color: var(--success);
        color: var(--success);
    }

    /* === RESULT TABLE === */
    .result-section {
        display: none;
        animation: fadeIn 0.5s ease;
    }

    .result-section.show { display: block; }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to   { opacity: 1; transform: translateY(0); }
    }

    .result-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 14px;
        flex-wrap: wrap;
        gap: 10px;
    }

    .result-title {
        font-family: 'Playfair Display', serif;
        font-size: 20px;
        color: var(--gold);
    }

    .result-count {
        font-size: 12px;
        color: var(--text-muted);
        padding: 4px 12px;
        border: 1px solid var(--border);
        border-radius: 100px;
    }

    table {
        width: 100%;
        border-collapse: separate;
        border-spacing: 0;
        border-radius: 12px;
        overflow: hidden;
        border: 1px solid var(--border);
    }

    thead th {
        background: linear-gradient(135deg, #1f1f2e, #16161f);
        color: var(--gold-light);
        font-size: 12px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 1.5px;
        padding: 14px 16px;
        text-align: left;
        border-bottom: 1px solid var(--border);
    }

    thead th:first-child { width: 70px; text-align: center; }
    thead th:last-child { text-align: center; }

    tbody td {
        padding: 13px 16px;
        font-size: 14px;
        border-bottom: 1px solid rgba(42, 42, 58, 0.5);
        transition: background 0.2s ease;
    }

    tbody tr:last-child td { border-bottom: none; }

    tbody tr:hover td { background: rgba(212, 175, 55, 0.04); }

    tbody td:first-child {
        text-align: center;
        font-weight: 600;
        color: var(--gold);
        background: rgba(212, 175, 55, 0.06);
        font-family: 'Playfair Display', serif;
        font-size: 16px;
    }

    tbody td:last-child { text-align: center; }

    tbody a {
        color: #8ab4f8;
        text-decoration: none;
        font-weight: 500;
        font-size: 13px;
        transition: color 0.2s;
        word-break: break-all;
    }

    tbody a:hover {
        color: var(--gold-light);
        text-decoration: underline;
    }

    /* === TOAST === */
    .toast {
        position: fixed;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%) translateY(100px);
        background: linear-gradient(135deg, var(--gold), var(--gold-dark));
        color: #0a0a0f;
        padding: 14px 28px;
        border-radius: 12px;
        font-weight: 600;
        font-size: 14px;
        box-shadow: 0 10px 40px rgba(212, 175, 55, 0.4);
        opacity: 0;
        transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        z-index: 999;
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .toast.show {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
    }

    /* === RESPONSIVE === */
    @media (max-width: 600px) {
        .container { padding: 24px 18px; }
        h1 { font-size: 24px; }
        .btn-row { flex-direction: column; }
        button { width: 100%; }
        thead th:first-child { width: 50px; }
        tbody td { padding: 10px 8px; font-size: 12px; }
        tbody a { font-size: 11px; }
    }

    /* === SCROLLBAR === */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: var(--bg-dark); }
    ::-webkit-scrollbar-thumb {
        background: var(--border);
        border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover { background: var(--gold-dark); }
</style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="badge">TOPANBOS88</div>
        <h1>Domain Extractor</h1>
        <p class="subtitle">Ekstrak Data Dari Web CARIKAN.ID > Paste Data Ke Doc</p>
    </div>

    <div class="input-group">
        <label>Tempel Data Mentah</label>
        <textarea id="inputData" placeholder="Tempel teks di sini...&#10;&#10;Contoh:&#10;01&#10;gopath.id&#10;https://gopath.id/link_topanbos88&#10;..."></textarea>
    </div>

    <div class="btn-row">
        <button class="btn-primary" onclick="prosesData()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>
            </svg>
            Proses Data
        </button>
        <button class="btn-secondary" onclick="clearAll()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="3 6 5 6 21 6"></polyline>
                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
            </svg>
            Bersihkan
        </button>
    </div>

    <div class="result-section" id="resultSection">
        <div class="result-header">
            <div class="result-title">Hasil Ekstraksi</div>
            <div class="result-count" id="resultCount">0 domain</div>
        </div>

        <div class="btn-row" style="margin-bottom:16px;">
            <button class="btn-secondary" id="btnCopyTable" onclick="copyTable()" style="flex:1; justify-content:center;">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                    <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                </svg>
                Copy Tabel (Spreadsheet)
            </button>
            <button class="btn-secondary" id="btnCopyLinks" onclick="copyLinks()" style="flex:1; justify-content:center;">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
                    <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
                </svg>
                Copy Link Saja
            </button>
        </div>

        <table>
            <thead>
                <tr>
                    <th>No</th>
                    <th>Domain Link</th>
                </tr>
            </thead>
            <tbody id="tbodyHasil"></tbody>
        </table>
    </div>
</div>

<div class="toast" id="toast">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"></polyline>
    </svg>
    <span id="toastMsg">Berhasil disalin!</span>
</div>

<script>
    let hasilData = [];

    function prosesData() {
        const input = document.getElementById('inputData').value;
        const lines = input.split('\n');
        hasilData = [];
        let counter = 1;

        for (let i = 0; i < lines.length; i++) {
            const line = lines[i].trim();
            if (line.startsWith('http://') || line.startsWith('https://')) {
                hasilData.push({ no: counter++, link: line });
            }
        }

        renderTable();
        document.getElementById('resultCount').textContent = hasilData.length + ' domain';
        document.getElementById('resultSection').classList.add('show');

        if (hasilData.length === 0) {
            showToast('Tidak ada link ditemukan');
        } else {
            showToast(hasilData.length + ' domain berhasil diekstrak');
        }
    }

    function renderTable() {
        const tbody = document.getElementById('tbodyHasil');
        tbody.innerHTML = '';
        hasilData.forEach(item => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${item.no}</td>
                <td><a href="${item.link}" target="_blank" rel="noopener">${item.link}</a></td>
            `;
            tbody.appendChild(tr);
        });
    }

    function copyTable() {
        if (hasilData.length === 0) return showToast('Belum ada data');
        const text = hasilData.map(i => `${i.no}\t${i.link}`).join('\n');
        navigator.clipboard.writeText(text).then(() => {
            flashButton('btnCopyTable', 'Tersalin!');
            showToast('Tabel siap tempel ke spreadsheet');
        });
    }

    function copyLinks() {
        if (hasilData.length === 0) return showToast('Belum ada data');
        const text = hasilData.map(i => i.link).join('\n');
        navigator.clipboard.writeText(text).then(() => {
            flashButton('btnCopyLinks', 'Tersalin!');
            showToast('Daftar link berhasil disalin');
        });
    }

    function flashButton(id, msg) {
        const btn = document.getElementById(id);
        const original = btn.innerHTML;
        btn.classList.add('copied');
        btn.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg> ${msg}`;
        setTimeout(() => {
            btn.classList.remove('copied');
            btn.innerHTML = original;
        }, 2000);
    }

    function clearAll() {
        document.getElementById('inputData').value = '';
        document.getElementById('resultSection').classList.remove('show');
        document.getElementById('tbodyHasil').innerHTML = '';
        hasilData = [];
        showToast('Data dibersihkan');
    }

    let toastTimeout;
    function showToast(msg) {
        const toast = document.getElementById('toast');
        document.getElementById('toastMsg').textContent = msg;
        toast.classList.add('show');
        clearTimeout(toastTimeout);
        toastTimeout = setTimeout(() => toast.classList.remove('show'), 2500);
    }
</script>

</body>
</html>
